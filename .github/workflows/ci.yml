name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Measured, not guessed. With the fixture audit's O(n^2) parent lookup
    # fixed (0238dfa) a full run — install, verify, the 165-document audit,
    # playwright install and e2e:ci — takes about 18 minutes, of which e2e is
    # 6.4. 45 leaves room for a slow runner without letting a hang sit for an
    # hour. It was 90 while the audit alone could exceed that, and 30 before
    # anything past `verify` had ever run to completion here.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: theRealestAEP/wordinweb-parity
          path: wordinweb-parity

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm install --no-save --no-audit --no-fund @rollup/rollup-linux-x64-gnu@4.62.2
      - run: npm run verify
      - run: npm run test:agent-fixtures
        env:
          WORDINWEB_FIXTURES: ${{ github.workspace }}/wordinweb-parity
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:ci
