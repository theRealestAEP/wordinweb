name: CI

on:
  push:
    branches:
      - main
      - likeoffice
      - "likeoffice-*"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # 30 minutes was never a measured budget: until b8abc14 this job died in
    # `npm run verify` after ~2.5 minutes, so nothing after it had ever run to
    # completion here. With verify green, `test:agent-fixtures` alone passed 25
    # minutes and was still going when the cap cancelled it — it opens every
    # corpus document and checks each component is reachable and inspectable,
    # which takes 12+ minutes on a 16-worker laptop and far longer on a 2-core
    # runner. `e2e:ci` after it has never run in CI at all.
    #
    # So this is deliberately generous rather than tight. Tighten it once a full
    # run has reported real numbers; a cap below the work's actual cost reads as
    # a red suite, which is worse than a slow one.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: theRealestAEP/wordinweb-parity
          path: wordinweb-parity

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm install --no-save --no-audit --no-fund @rollup/rollup-linux-x64-gnu@4.62.2
      - run: npm run verify
      - run: npm run test:agent-fixtures
        env:
          WORDINWEB_FIXTURES: ${{ github.workspace }}/wordinweb-parity
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:ci
