<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wordinweb collab — anon-share demo</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; background: #f1f3f4; color: #202124; }
      header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        padding: 10px 16px; background: #fff; border-bottom: 1px solid #dadce0; }
      header b { font-size: 15px; }
      header .pill { background: #e8f0fe; color: #1a73e8; border-radius: 12px; padding: 3px 10px; }
      header input { font: 12px ui-monospace, monospace; width: 320px; max-width: 50vw;
        padding: 4px 8px; border: 1px solid #dadce0; border-radius: 6px; }
      header button { font: 13px system-ui; padding: 5px 12px; border: 1px solid #dadce0;
        background: #1a73e8; color: #fff; border-radius: 6px; cursor: pointer; }
      header a { color: #1a73e8; }
      header button.ghost { background: #fff; color: #202124; }
      header button.ghost:hover { background: #f8f9fa; }
      header button:focus-visible, .modal button:focus-visible,
      header input:focus-visible, .modal input:focus-visible {
        outline: 2px solid #1a73e8; outline-offset: 2px;
      }
      /* The in-session control row (download, disconnect, versions, owner
         controls). These are SECONDARY to the document, so they are outlined
         rather than filled — a row of solid blue buttons competes with the
         page content for attention, and none of them is the primary action.
         The owner's read-only toggle is the one exception below: it changes
         what everyone else can do, so it should not look like "Download". */
      .sessionbar button { font: 13px system-ui; padding: 5px 11px; border: 1px solid #dadce0;
        background: #fff; color: #202124; border-radius: 6px; cursor: pointer; }
      .sessionbar button:hover:not([disabled]) { background: #f8f9fa; border-color: #c6cbd1; }
      .sessionbar button:focus-visible { outline: 2px solid #1a73e8; outline-offset: 2px; }
      .sessionbar button[disabled] { opacity: .5; cursor: default; }
      /* Owner-only, and destructive-ish: it silences everyone else. Amber
         while ARMED so the person holding the lock can see they are holding
         it — a lock you forget you set looks like a broken document to
         everybody else in the room. */
      .sessionbar button.owner[aria-pressed="true"] { background: #fef7e0; border-color: #f9ab00; color: #7a5900; }
      /* Tiny per-participant actions (demote, kick) sitting inside a roster
         chip. Square, quiet, and only ever rendered for the owner. */
      .sessionbar button.chip { font-size: 10px; line-height: 1; padding: 2px 4px; border-radius: 4px;
        border: 1px solid #dadce0; background: #fff; color: #5f6368; cursor: pointer; }
      .sessionbar button.chip:hover { background: #f1f3f4; color: #202124; }
      /* GATE SCREENS: what you see INSTEAD of a document — needs a share
         code, already open elsewhere, session gone, connection lost. These
         are the first thing a person following a shared link sees, and they
         were bare text and default controls pinned to the top-left of an
         empty page, which reads as a broken page rather than a question.
         Centred card, so it reads as "answer this to continue". */
      .gate { display: flex; justify-content: center; padding: 56px 16px; }
      .gate-card { background: #fff; border: 1px solid #e0e3e7; border-radius: 12px;
        padding: 22px 24px; width: 440px; max-width: 100%; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
      .gate-card h2 { margin: 0 0 6px; font-size: 16px; }
      .gate-card > p { margin: 0 0 16px; color: #5f6368; font-size: 13px; line-height: 1.5; }
      .gate-row { display: flex; gap: 8px; align-items: center; }
      .gate-card input { flex: 1; min-width: 0; font: 13px system-ui; padding: 8px 10px;
        border: 1px solid #dadce0; border-radius: 6px; }
      .gate-card input:focus-visible { outline: 2px solid #1a73e8; outline-offset: 1px; border-color: #1a73e8; }
      .gate-card button { font: 13px system-ui; padding: 8px 16px; border-radius: 6px;
        border: 1px solid transparent; background: #1a73e8; color: #fff; cursor: pointer; white-space: nowrap; }
      .gate-card button:hover:not([disabled]) { background: #1765cc; }
      .gate-card button[disabled] { opacity: .45; cursor: default; }
      .gate-card button.ghost { background: #fff; color: #202124; border-color: #dadce0; }
      .gate-card button.ghost:hover { background: #f8f9fa; }
      /* Secondary escape hatch, separated so it never competes with the
         primary action — "start a new document" abandons the one you were
         invited to, which is the wrong thing to click by accident. */
      .gate-foot { margin: 16px 0 0; padding-top: 14px; border-top: 1px solid #f1f3f4;
        font-size: 13px; color: #5f6368; display: flex; gap: 8px; align-items: center; }
      /* Wordmark: the product name plain, "Collaborative" set apart. This is
         the collab build of WordInWeb, and the header should say which of the
         two you are looking at without reading the subtitle. */
      .brand .word { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
      .brand .collab { font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
        font-size: 18px; font-weight: 700; color: #1a73e8; margin-left: 5px;
        transform: rotate(-2deg); display: inline-block; }
      /* Project links, pushed to the far side and quiet: useful to a visitor
         evaluating the project, never competing with the session controls. */
      .brand-links { display: flex; gap: 14px; align-items: center; }
      .brand-links a { font-size: 12px; color: #5f6368; text-decoration: none; white-space: nowrap; }
      .brand-links a:hover { color: #1a73e8; text-decoration: underline; }
      .hint { color: #5f6368; font-size: 12px; }
      #root { padding: 16px; }

      /* Wordmark: one line + a small subtitle. The subtitle is the product's
         actual claim, not a tagline — letterspaced small caps so it reads as a
         property of the thing rather than marketing copy. */
      .brand { display: flex; flex-direction: column; line-height: 1.15; margin-right: 4px; }
      .brand b { font-size: 15px; letter-spacing: -0.01em; }
      .brand .sub { font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
        text-transform: uppercase; color: #5f6368; }
      .spacer { flex: 1 1 auto; }

      /* Name control sits inline in the header; it is a text field, not a
         dialog, because changing your display name should cost one click. */
      header input.alias { font: 13px system-ui; width: 132px; }

      /* Above the toolbar, which sits at var(--dxw-toolbar-z-index, 100) and
         renders its dropdowns at that same level. At 60 the scrim dimmed the
         page but left the ribbon bright and clickable on top of it: the
         dialog said aria-modal while the toolbar underneath stayed live.
         200 clears the toolbar and its popovers together.

         The countdown toast (z-index 50) is now below this, which costs
         nothing today — the scrim is used in exactly one place, the
         local-editor "Start Collab" dialog, which only exists BEFORE a
         session starts, so there is no session deadline to bury. If a scrim
         ever appears during a live session, revisit that: a lifetime warning
         cannot be cancelled and offers a download, so hiding it would be the
         wrong trade. */
      .modal-scrim { position: fixed; inset: 0; background: rgba(32,33,36,.45);
        display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
      .modal { background: #fff; border-radius: 12px; padding: 20px; width: 420px; max-width: 100%;
        box-shadow: 0 8px 32px rgba(0,0,0,.24); }
      .modal h2 { margin: 0 0 6px; font-size: 17px; }
      .modal p { margin: 0 0 14px; color: #5f6368; font-size: 13px; line-height: 1.5; }
      .modal label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
      .modal input { font: 13px system-ui; width: 100%; box-sizing: border-box;
        padding: 7px 10px; border: 1px solid #dadce0; border-radius: 6px; }
      .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
      .modal button { font: 13px system-ui; padding: 7px 14px; border-radius: 6px; cursor: pointer;
        border: 1px solid #dadce0; background: #1a73e8; color: #fff; }
      .modal button.ghost { background: #fff; color: #202124; }
      .modal button[disabled] { opacity: .6; cursor: default; }

      /* Countdown toward an announced session ending. DELIBERATELY NOT A
         MODAL: the session stays fully usable through the grace period, and
         for the idle deadline typing is what cancels it — a dialog that stole
         the caret would prevent the one action that saves the session. It sits
         out of the text column instead and lets editing continue underneath. */
      .countdown { position: fixed; right: 16px; bottom: 16px; z-index: 50;
        width: 320px; max-width: calc(100vw - 32px); background: #fff;
        border: 1px solid #dadce0; border-left: 4px solid #f9ab00; border-radius: 10px;
        padding: 12px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
      /* Red for the deadline nothing can cancel, amber for the one editing
         resets — the color says which kind of ending this is before the text. */
      .countdown[data-reason="lifetime"] { border-left-color: #d93025; }
      .countdown b { display: block; font-size: 13px; margin-bottom: 3px; }
      .countdown .clock { font: 600 16px ui-monospace, monospace; font-variant-numeric: tabular-nums; }
      .countdown p { margin: 5px 0 0; font-size: 12px; color: #5f6368; line-height: 1.45; }
      .countdown button { margin-top: 10px; font: 13px system-ui; padding: 6px 12px;
        border-radius: 6px; border: 1px solid #dadce0; background: #fff; color: #202124; cursor: pointer; }
      .countdown button:hover { background: #f8f9fa; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
