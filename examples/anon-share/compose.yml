# wordinweb collab demo — the whole deployable stack.
#
#   DOMAIN=docs.example.com docker compose up -d      (public, real TLS)
#   docker compose up                                  (localhost, Caddy's
#                                                       internal CA)
#
# ZERO CUSTODY IS THE CONTRACT, not a limitation to work around: rooms live in
# the collab server's memory and die with it. A restart wipes every live
# session and loses NOTHING DURABLE — each browser holds its own document in
# IndexedDB and revives it on reconnect. That is why there is no database
# service here and no volume for document state; adding one would break the
# claim the demo is built on. The only volumes are Caddy's certificates, which
# are infrastructure, not user content.
services:
  collab:
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
    # NOT published to the host: the only way in is through Caddy, on the same
    # origin as the app. Exposing 1234 directly would reintroduce the
    # cross-origin (and plain-http) path this stack exists to remove.
    expose:
      - "1234"
    environment:
      # ── the server's whole env surface ──────────────────────────────────
      PORT: "1234"
      # info | debug | silent. Structured lines on stderr; `debug` is the
      # per-op firehose and is not a production setting.
      WW_LOG_LEVEL: "info"
      # Optional: also append logs to a file inside the container. Usually
      # leave unset and let the container runtime collect stderr (below).
      # WW_LOG_FILE: "/var/log/wordinweb.log"
      # Max concurrent rooms; further joins are refused rather than degrading
      # everyone. 10 suits one small droplet.
      WW_ROOM_CAP: "10"
      # ── SESSION LIFECYCLE ────────────────────────────────────────────────
      # Empty room (everyone disconnected) → deleted after this long. The
      # zero-custody promise's actual enforcement point.
      WW_EMPTY_ROOM_TTL_MS: "60000"
      # No QUALIFYING ACTIVITY from anyone → the room is warned, then ended.
      # Activity = accepted edits, admin actions, media transfers and joins —
      # deliberately NOT presence, or one forgotten tab keeps a room alive
      # forever and the timeout does nothing.
      WW_IDLE_TIMEOUT_MS: "600000"
      WW_IDLE_WARNING_MS: "60000"
      # ABSOLUTE cap on a room's age, reset by nothing. The idle timeout can
      # be held off indefinitely by a script editing every nine minutes; this
      # is the wall it hits. Ending a session does not lose the document —
      # any holder re-seeds from their bundle into a new epoch.
      WW_ROOM_MAX_LIFETIME_MS: "43200000"
      WW_LIFETIME_WARNING_MS: "300000"
      # ── PER-IP LIMITS ────────────────────────────────────────────────────
      # Seeds per minute, live rooms, and concurrent sockets per address.
      # NAT CAVEAT: an office, a school and a carrier's CGNAT pool each look
      # like ONE address, so these are deliberately generous. If real users
      # are being refused, raise them — the cost is RAM proportional to live
      # rooms, nothing more.
      WW_IP_SEED_PER_MIN: "10"
      WW_IP_MAX_DOCS: "25"
      WW_IP_MAX_CONNS: "50"
      # TRUSTED PROXY HOP COUNT — not a boolean. 1 = the Caddy in this file.
      # X-Forwarded-For is read ONLY when this is set, and only the entry this
      # many from the RIGHT (each hop appends the address it saw, so the
      # left-most entry is whatever the client typed). Setting it higher than
      # the real hop count re-opens spoofing; copying this service OUT from
      # behind the proxy requires setting it back to 0, or per-IP protection
      # silently switches off while still appearing configured.
      WW_TRUST_PROXY: "1"
      # ── SURGE VALVES ─────────────────────────────────────────────────────
      # Largest inbound WS frame. Must stay above the 256KB envelope cap plus
      # base64/JSON overhead. `ws` defaults to 100MiB, which lets a hostile
      # peer make the server buffer and parse a huge frame before any
      # hub-level check runs — this is the first wall and has to be.
      WW_WS_MAX_PAYLOAD: "524288"
      # Per-socket outbound buffer ceiling. A client that never reads makes
      # Node hold every broadcast for it in server memory; past this the
      # socket is terminated. Costs that peer a reconnect, costs the room
      # nothing.
      WW_WS_MAX_BUFFERED: "4194304"
      # One room's retained envelope log. The multiplicative hole: 256KB
      # envelopes at the rate cap from a room's worth of connections is
      # inside every other limit and still grows this at ~1GB/s, and pruning
      # only happens at a quiescent checkpoint a hostile room never reaches.
      # A sealed keystroke is ~500 bytes, so nobody real comes near this.
      WW_ROOM_LOG_MAX_BYTES: "67108864"
      # Global ceilings. Per-IP caps bound one address, not a botnet. New
      # sessions are refused (503 / server-busy); existing ones are untouched.
      # _GLOBAL suffix is deliberate: WW_MAX_CONNS would sit one character
      # from the per-IP WW_IP_MAX_CONNS and mean something entirely
      # different — confusing them either throttles the whole server to one
      # address's budget or opens the per-IP cap to the global one.
      WW_MAX_ROOMS_GLOBAL: "2000"
      WW_MAX_CONNS_GLOBAL: "5000"
      # ── MEDIA ────────────────────────────────────────────────────────────
      # Largest single upload. 5MB is the public number; a 413 carries this
      # value so the UI can name it. The socket-level guard derives from it
      # (+2MB headroom) — do not add a second constant beside it.
      WW_MEDIA_MAX_BLOB_BYTES: "5242880"
      WW_MEDIA_MAX_ROOM_BYTES: "104857600"
      # Unpromoted upload lifetime, and TTL after last download. The relay is
      # a CACHE, not a store: every blob is recoverable from participants by
      # re-supply, so expiry costs latency, never data.
      WW_MEDIA_STAGE_TTL_MS: "60000"
      WW_MEDIA_TTL_MS: "300000"
      # WW_OBS=1 additionally EXPOSES GET /stats. Left unset deliberately —
      # Caddy does not proxy /stats either, so enabling it is a two-step,
      # conscious act. /healthz is ungated and is what probes should use.
      # WW_OBS: "1"
    healthcheck:
      # The ungated liveness route (see cli.ts): proves the listener answers
      # without requiring the metrics surface to be open.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1234/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    # ── LOG SHIPPING ──────────────────────────────────────────────────────
    # The server writes structured lines to stderr, which is already the shape
    # a collector wants. The json-file driver below just bounds disk on the
    # droplet; point any collector (Vector, Promtail, the Datadog agent, …) at
    # the Docker socket or these files and nothing in the app changes. Do NOT
    # raise WW_LOG_LEVEL to debug to "get more into the collector" — that is
    # the per-op firehose and it will bury the signal.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - collab
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Your hostname. Unset ⇒ the Caddyfile falls back to `localhost` and
      # Caddy issues a cert from its own internal CA, which is enough to make
      # `crypto.subtle` available for a local `docker compose up` smoke test.
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The built app, produced by the frontend image's `dist` stage.
      - app-dist:/srv:ro
      # Certificates and ACME account keys. THE ONE THING WORTH PERSISTING:
      # losing it means re-requesting certificates on every restart, which
      # Let's Encrypt rate-limits.
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  # Builds the static bundle into the shared volume, then exits. Compose runs
  # it on every `up`, so a rebuilt image republishes the app.
  app:
    build:
      context: ../..
      dockerfile: examples/anon-share/Dockerfile
      target: build
    command: sh -c "rm -rf /out/* && cp -r /app/examples/anon-share/dist/. /out/"
    volumes:
      - app-dist:/out
    restart: "no"

volumes:
  app-dist:
  caddy-data:
  caddy-config:
