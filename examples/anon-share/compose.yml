# Minimal anon-share demo stack (plan doc 10 ephemeral tier): the collab
# server on a volume, nothing else. "Restart wipes it" IS the contract for
# the demo — no external database or blob store.
#
#   docker compose up
#
# The frontend (Vite dev server / static build of examples/anon-share) points
# its useCollab url at ws://localhost:1234.
services:
  collab:
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
    ports:
      - "1234:1234"
    environment:
      PORT: "1234"
    # Ephemeral by contract: in-memory storage, no volume needed. Add a volume
    # here only if you swap the entrypoint for a SQLite-per-doc driver.
    restart: unless-stopped
